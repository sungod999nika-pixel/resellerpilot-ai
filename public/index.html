<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ResellerPilot AI - Vendor Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.2s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Top App Bar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-3xl mx-auto px-4 py-2.5 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <button onclick="toggleDrawer()" class="p-2 -ml-2 text-slate-600 rounded-lg md:hidden" aria-label="Menu">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white font-bold text-sm shadow">RP</div>
        <div>
          <h1 class="text-base font-bold text-slate-900 leading-tight">ResellerPilot <span class="text-blue-600">AI</span></h1>
          <p class="text-[10px] text-slate-500 font-medium">Smart Vendor Growth Engine</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <div id="aiHealthBadge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 border border-slate-200">
          <span class="w-2 h-2 rounded-full bg-slate-400" id="aiHealthDot"></span>
          <span id="aiHealthText">Checking...</span>
        </div>
        <select id="currencySelector" onchange="updateCurrency()" class="bg-slate-100 text-xs font-bold text-slate-700 rounded-lg p-1 border border-slate-200 outline-none">
          <option value="₦">₦ NGN</option>
          <option value="$">$ USD</option>
          <option value="KSh">KSh KES</option>
          <option value="GH₵">GH₵ GHS</option>
          <option value="£">£ GBP</option>
          <option value="€">€ EUR</option>
          <option value="₹">₹ INR</option>
        </select>
      </div>
    </div>

    <!-- Navigation Strip (Swipeable on Mobile) -->
    <nav class="border-t border-slate-100 bg-white/95 backdrop-blur">
      <div class="max-w-3xl mx-auto px-3 py-2 flex items-center space-x-2 overflow-x-auto no-scrollbar">
        <button onclick="switchTab('feature-ads')" id="nav-feature-ads" class="tool-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition bg-blue-600 text-white shadow-sm">1. Ad Generator</button>
        <button onclick="switchTab('feature-desc')" id="nav-feature-desc" class="tool-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition bg-slate-100 text-slate-600">2. Descriptions</button>
        <button onclick="switchTab('feature-reply')" id="nav-feature-reply" class="tool-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition bg-slate-100 text-slate-600">3. Customer Reply</button>
        <button onclick="switchTab('feature-calc')" id="nav-feature-calc" class="tool-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition bg-slate-100 text-slate-600">4. Offline Profit</button>
        <button onclick="switchTab('feature-social')" id="nav-feature-social" class="tool-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition bg-slate-100 text-slate-600">5. Social Media</button>
        <button onclick="switchTab('feature-promo')" id="nav-feature-promo" class="tool-tab flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition bg-slate-100 text-slate-600">6. Promo Planner</button>
      </div>
    </nav>
  </header>

  <!-- Slide-Over Drawer -->
  <div id="drawerBackdrop" onclick="toggleDrawer()" class="fixed inset-0 bg-slate-900/50 z-50 opacity-0 pointer-events-none transition-opacity duration-200"></div>
  <aside id="menuDrawer" class="fixed top-0 left-0 bottom-0 w-64 bg-white z-50 shadow-2xl -translate-x-full transition-transform duration-200 flex flex-col p-4 space-y-2">
    <div class="flex items-center justify-between pb-3 border-b border-slate-100">
      <span class="font-bold text-sm text-slate-900">All 6 Features</span>
      <button onclick="toggleDrawer()" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <button onclick="switchTab('feature-ads'); toggleDrawer();" class="text-left py-2 px-3 rounded-lg hover:bg-slate-100 text-xs font-semibold text-slate-700">1. AI Ad Generator</button>
    <button onclick="switchTab('feature-desc'); toggleDrawer();" class="text-left py-2 px-3 rounded-lg hover:bg-slate-100 text-xs font-semibold text-slate-700">2. Product Descriptions</button>
    <button onclick="switchTab('feature-reply'); toggleDrawer();" class="text-left py-2 px-3 rounded-lg hover:bg-slate-100 text-xs font-semibold text-slate-700">3. Customer Reply Assistant</button>
    <button onclick="switchTab('feature-calc'); toggleDrawer();" class="text-left py-2 px-3 rounded-lg hover:bg-slate-100 text-xs font-semibold text-slate-700">4. Offline Profit Calculator</button>
    <button onclick="switchTab('feature-social'); toggleDrawer();" class="text-left py-2 px-3 rounded-lg hover:bg-slate-100 text-xs font-semibold text-slate-700">5. Social Media Generator</button>
    <button onclick="switchTab('feature-promo'); toggleDrawer();" class="text-left py-2 px-3 rounded-lg hover:bg-slate-100 text-xs font-semibold text-slate-700">6. Promotion Planner</button>
  </aside>

  <!-- Main Viewport -->
  <main class="flex-1 max-w-3xl w-full mx-auto p-4 pb-16">
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs px-4 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300">Action completed</div>

    <!-- Diagnostic Banner -->
    <div id="connectionBanner" class="hidden mb-4 p-3.5 rounded-xl border text-xs space-y-1.5">
      <div class="flex items-start gap-2">
        <i data-lucide="info" class="w-4 h-4 flex-shrink-0 mt-0.5" id="bannerIcon"></i>
        <div id="bannerText" class="font-medium leading-relaxed"></div>
      </div>
    </div>

    <!-- 1. AI Advertisement Generator -->
    <section id="feature-ads" class="tab-content active space-y-4">
      <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
        <h2 class="text-base font-bold text-slate-900">1. AI Advertisement Generator</h2>
        <form onsubmit="event.preventDefault(); handleAd();" class="space-y-3 mt-3">
          <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Product Name *</label><input type="text" id="adName" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm outline-none" placeholder="e.g. Smart Watch" /></div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Price (<span class="curr">₦</span>) *</label><input type="number" id="adPrice" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm outline-none" placeholder="15000" /></div>
            <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Platform</label><select id="adPlatform" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white outline-none"><option>WhatsApp</option><option>Instagram</option><option>Facebook</option><option>TikTok</option></select></div>
          </div>
          <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Target Audience</label><input type="text" id="adAudience" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm outline-none" placeholder="e.g. Gym enthusiasts, busy moms" /></div>
          <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Key Benefits *</label><textarea id="adBenefits" rows="2" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm outline-none" placeholder="e.g. 7-day battery life, waterproof, sleep tracker"></textarea></div>
          <div id="adError" class="hidden p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium"></div>
          <button type="submit" id="btnAd" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-sm transition">Generate Advertisement</button>
        </form>
      </div>
      <div id="adCard" class="hidden bg-white rounded-2xl p-5 border border-blue-200 shadow-sm space-y-2">
        <div class="flex items-center justify-between"><span class="text-xs font-bold uppercase text-blue-800" id="adTag">Generated Ad</span><button onclick="copyText('adOut')" class="text-xs font-semibold px-2.5 py-1 bg-blue-50 text-blue-700 rounded-lg">Copy</button></div>
        <div id="adOut" class="text-sm whitespace-pre-wrap bg-slate-50 p-3 rounded-lg border border-slate-200 font-mono"></div>
      </div>
    </section>

    <!-- 2. Product Description Generator -->
    <section id="feature-desc" class="tab-content space-y-4">
      <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm">
        <h2 class="text-base font-bold text-slate-900">2. Product Description Generator</h2>
        <form onsubmit="event.preventDefault(); handleDesc();" class="space-y-3 mt-3">
          <div class="grid grid-cols-2 gap-3">
            <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Title *</label><input type="text" id="descTitle" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm outline-none" placeholder="e.g. Memory Foam Pillow" /></div>
            <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Niche</label><select id="descNiche" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white outline-none"><option>Health & Beauty</option><option>Fashion</option><option>Electronics</option><option>Home & Living</option><option>General</option></select></div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tone</label><select id="descTone" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white outline-none"><option>Persuasive & Direct</option><option>Luxury & Elegant</option><option>Friendly & Warm</option></select></div>
            <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Specs</label><input type="text" id="descSpecs" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm outline-none" placeholder="e.g. Washable velvet, 50x30cm" /></div>
          </div>
          <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Problem Solved *</label><textarea id="descProblem" rows="2" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm outline-none" placeholder="e.g. Relieves chronic neck stiffness and morning soreness"></textarea></div>
          <div id="descError" class="hidden p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium"></div>
          <button type="submit" id="btnDesc" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-sm transition">Generate Description</button>
        </form>
      </div>
      <div id="descCard" class="hidden bg-white rou
